name: Deploy Static Sites

on:
  push:
    branches:
      - main
      - feat/new-page

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy MAIN (vltspecialisten.se)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          destination_dir: .

      - name: Deploy NEW (new.vltspecialisten.se)
        if: github.ref == 'refs/heads/feat/new-page'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          destination_dir: new
